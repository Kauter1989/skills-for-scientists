<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>__TITLE__ · __PERIOD__</title>
<style>
:root{--paper:#f5f3ef;--card:#fff;--ink:#151a21;--muted:#5e6876;--line:#dde2e7;--line2:#c5ccd5;--teal:#17605c;--teal2:#e4efed;--green:#1c7346;--green2:#e6f3ea;--amber:#9a5b00;--amber2:#fbf0da;--red:#a62a1f;--red2:#fbe9e6;--violet:#5f4e9b;--mono:ui-monospace,"Cascadia Code",Consolas,monospace;--sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
a{color:var(--teal);text-decoration-thickness:1px;text-underline-offset:2px}a:hover{color:#0b3f3c}.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hero{padding:46px 0 18px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:26px}.brand{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:750;color:var(--teal)}.stamp{font-size:11.5px;color:var(--muted)}
h1{font-size:clamp(32px,5vw,58px);line-height:1.02;letter-spacing:-.035em;margin:0 0 14px;max-width:980px}.lede{font-size:17px;color:var(--muted);max-width:860px;margin:0 0 20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:11.5px;color:var(--muted)}.chip b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:26px 0 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:92px}.kpi span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:750}.kpi b{display:block;font-size:25px;line-height:1.1;margin:7px 0 4px;letter-spacing:-.02em}.kpi small{color:var(--muted);font-size:10.5px}
.nav{position:sticky;top:0;z-index:20;background:rgba(245,243,239,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:24px}.nav .wrap{display:flex;gap:16px;align-items:center;min-height:46px;flex-wrap:wrap;font-size:12px}.nav a{color:var(--muted);text-decoration:none}.nav a:hover{color:var(--ink)}
.section{background:var(--card);border:1px solid var(--line);border-radius:15px;margin:16px 0;overflow:hidden}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;padding:20px 22px 15px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:750;margin:0 0 4px}h2{font-size:25px;line-height:1.15;letter-spacing:-.02em;margin:0}h3{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.01em}.section-note{max-width:560px;color:var(--muted);font-size:12px;margin:0}.section-body{padding:20px 22px 24px}
.summary{max-width:960px;margin:18px 0 0;font-size:16px;line-height:1.6}.callout{border:1px solid var(--line);border-left:4px solid var(--teal);background:#fbfdfd;border-radius:10px;padding:13px 15px;margin:16px 0}.callout b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}.callout ul{margin:0;padding-left:18px}.callout li{font-size:12.5px;color:var(--amber);margin-bottom:4px}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.theme{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;border-top:4px solid var(--teal)}.theme-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.theme p{font-size:13.5px;margin:0 0 9px}.meta{font-size:10.5px;color:var(--muted);margin-bottom:8px}.evidence{margin:0;padding-left:17px}.evidence li{font-size:11.5px;margin-bottom:4px}.badge{display:inline-flex;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.badge.high{background:var(--green2);color:var(--green)}.badge.medium{background:var(--amber2);color:var(--amber)}.badge.low{background:var(--red2);color:var(--red)}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0}.field{display:flex;flex-direction:column;gap:4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}.field input,.field select{border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink);font:13px var(--sans);padding:7px 9px;min-height:34px}.field input{min-width:230px}.field select{min-width:150px}
.table-wrap{overflow:auto}.papers,.datasets,.criteria,.queries{width:100%;border-collapse:collapse;font-size:12px}.papers th,.datasets th,.criteria th,.queries th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line2);padding:8px 9px;white-space:nowrap}.papers td,.datasets td,.criteria td,.queries td{border-bottom:1px solid var(--line);padding:9px;vertical-align:top}.papers tr:last-child td,.datasets tr:last-child td,.criteria tr:last-child td,.queries tr:last-child td{border-bottom:0}.paper-title{font-weight:700;font-size:13px;line-height:1.35}.venue{font-size:10.5px;color:var(--muted);margin-top:3px}.num{text-align:right;font-variant-numeric:tabular-nums}.rank{display:block;font-size:10.5px;color:var(--teal);font-weight:700;margin-bottom:3px}.directions{display:block;font-size:10px;color:var(--muted)}details{margin-top:6px}summary{cursor:pointer;color:var(--teal);font-size:10.5px;font-weight:700}details p{font-size:11px;color:var(--muted);margin:6px 0 0;max-width:760px}.empty{color:var(--muted);font-size:13px;margin:0}.subhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 7px}.clean{margin:0;padding-left:18px}.clean li{font-size:12.5px;margin-bottom:5px}.method-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.method-grid p{font-size:12.5px;color:var(--muted)}.queries{margin-bottom:12px}
code{font-family:var(--mono);font-size:11.5px;background:#f0f2f4;border-radius:4px;padding:1px 4px}.footer{padding:12px 0 40px;color:var(--muted);font-size:11.5px}.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.themes{grid-template-columns:1fr}.method-grid{grid-template-columns:1fr}}@media(max-width:620px){.wrap{padding:0 14px}.kpis{grid-template-columns:repeat(2,1fr)}.hero{padding-top:28px}.section-head{padding:16px}.section-body{padding:16px}.toolbar{padding:12px}.field input{min-width:100%}.field{flex:1 1 100%}}
@media print{@page{size:A4;margin:12mm}body{background:#fff;font-size:9.5pt}.nav,.toolbar{display:none}.wrap{max-width:none;padding:0}.section,.theme{break-inside:avoid}.kpis{grid-template-columns:repeat(3,1fr)}a{color:#000;text-decoration:none}.hero{padding-top:0}}
</style>
</head>
<body>
<main class="wrap">__BODY__</main>
<footer class="footer"><div class="wrap"><span>sci-literature-news · автономный отчёт, без внешних ресурсов</span><span>__PERIOD__</span></div></footer>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
(function(){
  "use strict";
  var rows = Array.prototype.slice.call(document.querySelectorAll("tr[data-paper]"));
  var search = document.getElementById("paper-search");
  var direction = document.getElementById("paper-direction");
  var category = document.getElementById("paper-category");
  var sort = document.getElementById("paper-sort");
  function apply(){
    var q = (search && search.value || "").toLowerCase().trim();
    var dir = direction && direction.value || "all";
    var cat = category && category.value || "all";
    rows.forEach(function(row){
      var ok = (!q || (row.getAttribute("data-search") || "").indexOf(q) >= 0);
      if (dir !== "all" && (" " + (row.getAttribute("data-directions") || "") + " ").indexOf(" " + dir + " ") < 0) ok = false;
      if (cat !== "all" && row.getAttribute("data-category") !== cat) ok = false;
      row.hidden = !ok;
    });
    document.querySelectorAll(".paper-section").forEach(function(section){
      section.hidden = cat !== "all" && section.getAttribute("data-category") !== cat;
    });
    var mode = sort && sort.value || "date";
    document.querySelectorAll(".paper-section tbody").forEach(function(tbody){
      var items = Array.prototype.slice.call(tbody.querySelectorAll("tr[data-paper]"));
      items.sort(function(a,b){
        if (mode === "citations") return Number(b.getAttribute("data-citations") || 0) - Number(a.getAttribute("data-citations") || 0);
        return String(b.getAttribute("data-date") || "").localeCompare(String(a.getAttribute("data-date") || ""));
      });
      items.forEach(function(row){ tbody.appendChild(row); });
    });
  }
  [search,direction,category,sort].forEach(function(el){ if(el){ el.addEventListener("input", apply); el.addEventListener("change", apply); } });
  apply();
})();
</script>
</body>
</html>
